<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>devChallenges.io | Minimal Blog Card</title>

   
    <style>
      * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background-color: #f5f5f5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
}

.card {
  background-color: white;
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  padding: 16px;
  max-width: 340px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

img {
  width: 100%;
  border-radius: 12px;
  object-fit: cover;
  height: 200px;
}

.tag {
  background-color: #f0ebff;
  color: #7c3aed;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  width: fit-content;
}

h2 {
  font-size: 1.2rem;
  color: #1a1a1a;
}

p {
  font-size: 0.9rem;
  color: #555;
  line-height: 1.6;
}

hr {
  border: none;
  border-top: 1px solid #eee;
}

.author {
  color: #333;
  font-size: 0.9rem;
}

.author-info {
  font-size: 14px;
  text-align: center;
  margin-top: 24px;
  color: rgb(55, 65, 81);
}

.author-info a {
  text-decoration: none;
  color: #7c3aed;
}
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./Cactus.jpg">
      <span class="tag">Desing</span>
        <h2>Embracing Minimalism</h2>
        <p>from minimalist sculptures to minimalist paintings,this is blog will inspire you to appreciate beauty that lies in simplicity</p>
        <hr>
        <p class="author">Amin Abel Gil</p>
    </div>
    <div class="author-info">
      Coded by <a href="https://github.com/Amin-coder2">Amin Abel Gil</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
